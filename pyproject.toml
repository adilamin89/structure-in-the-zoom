[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rung"
version = "1.2.1"
description = "rung: axis-resolved dimensionality scaling (matched floor, permutation null, nuisance-preserving null); code and data for 'Structure is in the zoom'"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18"]
test = ["pytest>=8"]

[project.scripts]
rung = "rung:main"
rung-render = "render_all:main"
theta-zoom = "rung:main"          # alias, one release
theta-zoom-render = "render_all:main"

[tool.setuptools]
py-modules = ["render_all", "rung", "theta_zoom"]
