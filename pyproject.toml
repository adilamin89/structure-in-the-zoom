[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rung"
version = "1.13.0"
description = "rung: axis-resolved dimensionality scaling (matched floor, permutation null, nuisance-preserving null); code and data for 'Structure is in the zoom'"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adil Amin" }]
keywords = ["dimensionality", "participation ratio", "neural populations", "representations", "symmetry", "interpretability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18"]
nwb = ["h5py>=3.8"]
scripts = ["h5py>=3.8", "numba>=0.59", "scikit-learn>=1.3"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/adilamin89/structure-in-the-zoom"
Repository = "https://github.com/adilamin89/structure-in-the-zoom"
Paper = "https://github.com/adilamin89/structure-in-the-zoom/blob/main/PAPER.md"

[project.scripts]
rung = "rung:main"
rung-render = "render_all:main"
theta-zoom = "rung:main"          # alias, one release
theta-zoom-render = "render_all:main"

[tool.setuptools]
py-modules = ["render_all", "rung", "theta_zoom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
